<div class="auth-panel">
  <h1>注册</h1>
  {{error_html}}
  <form action="/register" method="post" class="auth-form">
    <label for="username">用户名</label>
    <input type="text" id="username" name="username" maxlength="64" autocomplete="username" required>
    <label for="password">密码（6~64 位）</label>
    <input type="password" id="password" name="password" maxlength="64" minlength="6" autocomplete="new-password" required>
    <button type="submit" class="btn btn-primary btn-block">注册</button>
  </form>
  <p class="auth-alt">已有账号？<a href="/login">去登录</a></p>
</div>
