<div class="judge-result">
  <h1>判题结果</h1>
  <div class="result-banner result-{{status_name}}">
    <div class="result-status-line">
      <span class="status-icon">{{status_icon}}</span>
      <span class="result-status">{{status_label}}</span>
    </div>
    <span class="result-stats">
      <span class="stat-chip">{{time_icon}} {{time_ms}} ms</span>
      <span class="stat-chip">{{mem_icon}} {{memory_kb}} KB</span>
    </span>
  </div>
  {{compile_log_html}}
  <h2>逐用例结果</h2>
  <table class="case-table">
    <thead>
      <tr><th>用例</th><th>状态</th><th>时间</th><th>内存</th></tr>
    </thead>
    <tbody>{{case_rows}}</tbody>
  </table>
  <div class="result-actions">
    <a class="btn btn-primary" href="/problems/{{problem_id}}">返回题目</a>
    <a class="btn" href="/problems">返回题库</a>
  </div>
</div>
